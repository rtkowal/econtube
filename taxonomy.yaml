# EconTube taxonomy. Edit freely: the classifier only accepts slugs listed here.
# Each entry: slug, label, (description), (aliases), (parent), (jel).
# STATUS: draft. `topics` is a seed list; per the build plan it is regenerated from a
# 500-item classified sample, deduplicated, and frozen only after owner approval.

fields:   # two-level, built on AEA JEL codes, plain-English labels
  - {slug: general, label: "Economics in general & methodology", jel: A}
  - {slug: history-of-thought, label: "History of economic thought", jel: B, aliases: [methodology, heterodox]}
  - {slug: quantitative, label: "Quantitative methods & data", jel: C}
  - {slug: micro, label: "Microeconomics", jel: D}
  - {slug: behavioral, label: "Behavioral economics", jel: D9, parent: micro}
  - {slug: macro, label: "Macroeconomics & monetary", jel: E}
  - {slug: monetary-policy, label: "Monetary policy & central banking", jel: E5, parent: macro}
  - {slug: business-cycles, label: "Business cycles, inflation & growth", jel: E3, parent: macro}
  - {slug: fiscal-macro, label: "Fiscal policy & public debt", jel: E6, parent: macro}
  - {slug: international, label: "International economics", jel: F}
  - {slug: trade, label: "Trade & tariffs", jel: F1, parent: international}
  - {slug: intl-finance, label: "Exchange rates & international finance", jel: F3, parent: international}
  - {slug: finance, label: "Financial economics", jel: G}
  - {slug: banking, label: "Banking & financial crises", jel: G2, parent: finance}
  - {slug: corporate-finance, label: "Corporate finance & governance", jel: G3, parent: finance}
  - {slug: public, label: "Public economics & taxation", jel: H}
  - {slug: health-education-welfare, label: "Health, education & welfare", jel: I}
  - {slug: labor, label: "Labor & demographics", jel: J}
  - {slug: law-econ, label: "Law & economics", jel: K}
  - {slug: industrial-org, label: "Industries, competition & regulation", jel: L}
  - {slug: business, label: "Business, management & entrepreneurship", jel: M}
  - {slug: economic-history, label: "Economic history", jel: N}
  - {slug: development, label: "Development, innovation & growth", jel: O}
  - {slug: innovation, label: "Technology & innovation", jel: O3, parent: development}
  - {slug: systems, label: "Economic systems: capitalism, socialism, transition", jel: P}
  - {slug: transition, label: "Post-communist transition", jel: P2, parent: systems}
  - {slug: environment-energy, label: "Agriculture, energy & environment", jel: Q}
  - {slug: urban-housing, label: "Urban, housing & regional", jel: R}
  # non-JEL branches (JEL covers these badly)
  - {slug: markets-investing, label: "Markets & investing"}
  - {slug: credit, label: "Credit", parent: markets-investing}
  - {slug: rates, label: "Rates & bonds", parent: markets-investing}
  - {slug: equities, label: "Equities", parent: markets-investing}
  - {slug: private-markets, label: "Private markets", parent: markets-investing}
  - {slug: alternatives, label: "Alternatives", parent: markets-investing}
  - {slug: macro-investing, label: "Macro investing", parent: markets-investing}
  - {slug: money-bitcoin, label: "Money & Bitcoin"}
  - {slug: sound-money, label: "Gold & sound money", parent: money-bitcoin}
  - {slug: bitcoin, label: "Bitcoin & crypto", parent: money-bitcoin}

