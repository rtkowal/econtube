# EconTube source registry.
# `url` is the human homepage. `feeds` are CANDIDATE ingestion endpoints, tried in order
# (rss -> sitemap -> youtube_channel -> html). `pipeline/probe.py` verifies every candidate
# and writes reports/probe.md; nothing here is assumed to work until the probe confirms it.
# youtube_channels / podcast_feeds are filled by discovery (probe.py --discover);
# entries carry verified: true|false. Weight: 1.0 = normal curator, 3.0 = top curator.

defaults:
  language: en
  weight: 1.0

sources:
  # ---------------- Blogs & commentary ----------------
  - id: marginal-revolution
    name: Marginal Revolution
    url: https://marginalrevolution.com/
    type: rss
    weight: 3.0
    backfill: full
    feeds: [https://marginalrevolution.com/feed, https://marginalrevolution.com/sitemap.xml]
    notes: Highest weight. Cowen & Tabarrok link videos constantly. Full archive backfill via sitemap.
  - id: cafe-hayek
    name: Cafe Hayek
    url: https://cafehayek.com/
    type: rss
    weight: 1.5
    feeds: [https://cafehayek.com/feed, https://cafehayek.com/sitemap.xml]
  - id: noahpinion
    name: Noahpinion
    url: https://www.noahpinion.blog/
