name: classify-sample
# Step 2: gate + classify the current catalogue with OpenAI and commit reports/sample.md for review.
# Does NOT commit data/videos.json (taxonomy not yet approved). Runs on push of this file or manually.
on:
  workflow_dispatch:
permissions: {contents: write}
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: econtube-cache-${{ github.run_id }}
          restore-keys: econtube-cache-
      - name: check secrets present (never printed)
        run: |
          test -n "$OPENAI_API_KEY" && echo "OPENAI_API_KEY: set" || echo "OPENAI_API_KEY: MISSING"
          test -n "$YOUTUBE_API_KEY" && echo "YOUTUBE_API_KEY: set" || echo "YOUTUBE_API_KEY: MISSING"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: ingest a slice of MR + Hoover posts (polite)
        run: |
          python pipeline/ingest.py marginal-revolution --paged-feed --pages 40 --delay 3 || true
          python pipeline/ingest.py hoover --limit 150 || true
      - name: build + classify
        run: python pipeline/export_config.py && python pipeline/build_data.py 2>&1 | tail -40
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: python pipeline/sample_report.py
      - name: commit report only
        run: |
          git config user.name "econtube-bot"
          git config user.email "actions@users.noreply.github.com"
          cp .cache/llm_cost.jsonl reports/llm_cost.jsonl 2>/dev/null || true
          git add -f reports/sample.md reports/llm_cost.jsonl taxonomy_suggestions.jsonl 2>/dev/null || true
          git diff --cached --quiet || git commit -m "reports: classification sample"
          git pull --rebase -X theirs --autostash -q && git push
